<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>A place shared with you · ChiTransit</title>
<meta name="description" content="Open a place a friend shared in ChiTransit, or in Google Maps.">
<!--
  The page a shared location link opens: https://<our domain>/place?lat=…&lon=…&name=…
  (mobile/src/share/sharedPlace.ts writes these links). Self-contained on purpose - no scripts, fonts or
  images from anywhere else - so it costs one request and leaks the shared spot to nobody.

  With verified App Links (see share-web/README.md) a phone that has the app opens it directly and never
  shows this page. So whoever sees it is, mostly, a friend without ChiTransit: it opens the app if it is
  there after all, sends them to the store if not, and offers Google Maps either way.

  The link's parameters are permanent - a message sent today is tapped next year: lat, lon, name.
-->
<style>
  :root {
    --paper: #EEF1F5; --surface: #FFFFFF; --ink: #12171E; --muted: #39424F; --rule: #D6DCE3; --on-ink: #EEF1F5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #0D1117; --surface: #1C2430; --ink: #E6EBF1; --muted: #B4BECB; --rule: #2A333F; --on-ink: #0D1117; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    background: var(--paper); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%; max-width: 420px;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 20px;
    padding: 28px 24px 24px; box-shadow: 0 2px 8px rgba(11, 16, 23, .1);
  }
  .pin {
    width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center; background: var(--ink);
  }
  .pin svg { width: 32px; height: 32px; fill: var(--on-ink); }
  .eyebrow { margin: 0; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 6px 0 4px; text-align: center; font-size: 22px; line-height: 1.25; font-weight: 700; overflow-wrap: anywhere; }
  .lede { margin: 0 0 24px; text-align: center; color: var(--muted); }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px; padding: 0 20px; border-radius: 999px;
    font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer;
    border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink);
  }
  .btn svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
  .btn--primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
  .stores { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--rule); }
  .stores p { margin: 0 0 10px; text-align: center; font-size: 13px; color: var(--muted); }
  .note { margin: 14px 0 0; text-align: center; font-size: 13px; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="pin" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
  </div>
  <p class="eyebrow">Shared with you</p>
  <h1 id="name">A place</h1>
  <p class="lede" id="lede">Plan a trip there by train, bus, Metra or bike.</p>

  <div class="actions" id="actions">
    <a class="btn btn--primary" id="open-app" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c-4 0-8 .5-8 4v9.5A3.5 3.5 0 0 0 7.5 19L6 20.5v.5h2.23l2-2H14l2 2h2v-.5L16.5 19a3.5 3.5 0 0 0 3.5-3.5V6c0-3.5-3.58-4-8-4zM7.5 17A1.5 1.5 0 1 1 9 15.5 1.5 1.5 0 0 1 7.5 17zm3.5-7H6V6h5zm2 0V6h5v4zm3.5 7a1.5 1.5 0 1 1 1.5-1.5 1.5 1.5 0 0 1-1.5 1.5z"/></svg>
      Open in ChiTransit
    </a>
    <a class="btn" id="open-maps" href="#" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9a.5.5 0 0 0-.36.48V20.5a.5.5 0 0 0 .5.5l.16-.03L9 18.9l6 2.1 5.64-1.9a.5.5 0 0 0 .36-.48V3.5a.5.5 0 0 0-.5-.5zM15 19l-6-2.11V5l6 2.11z"/></svg>
      Open in Google Maps
    </a>
  </div>
  <p class="note" id="trying" hidden>Opening ChiTransit… If nothing happens, get the app below.</p>

  <div class="stores">
    <p>Don’t have ChiTransit yet?</p>
    <div class="actions">
      <a class="btn" id="play" href="https://play.google.com/store/apps/details?id=com.committeam.chitransit" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 2.3a1.5 1.5 0 0 0-.6 1.2v17a1.5 1.5 0 0 0 .6 1.2l9.7-9.7zm10.8 10.8L5.2 22.3l10.9-6.3zM17.7 9.4l-1.6-.9-2.7 2.5 2.7 2.7 1.6-.9a1.5 1.5 0 0 0 0-3.4zM5.2 1.7l9.2 9.2 1.7-1.7z"/></svg>
        Get it on Google Play
      </a>
      <span class="btn" id="app-store" aria-disabled="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.5 2-3.6 2.1-3.7a4.6 4.6 0 0 0-3.6-2c-1.5-.2-3 .9-3.7.9s-2-.9-3.2-.8A4.8 4.8 0 0 0 4 9.4c-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4s1.7-.8 3.1-.8 1.9.8 3.2.8 2.1-1.2 2.9-2.4a10 10 0 0 0 1.3-2.7 4.2 4.2 0 0 1-2.3-3.9zM14 5.2A4.3 4.3 0 0 0 15 2a4.4 4.4 0 0 0-2.9 1.5 4.1 4.1 0 0 0-1 3.1A3.6 3.6 0 0 0 14 5.2z"/></svg>
        App Store — coming soon
      </span>
    </div>
  </div>
</main>

<script>
  (function () {
    var PACKAGE = 'com.committeam.chitransit';
    var PLAY = 'https://play.google.com/store/apps/details?id=' + PACKAGE;

    var query = new URLSearchParams(location.search);
    var lat = Number(query.get('lat'));
    var lon = Number(query.get('lon'));
    var valid = query.get('lat') !== null && query.get('lon') !== null &&
      isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;

    // Text only: the name came from a link anyone can write, so it is never parsed as HTML.
    var name = (query.get('name') || '').replace(/[\u0000-\u001f\u007f]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80);
    document.getElementById('name').textContent = valid ? (name || 'Shared location') : 'This link has no place in it';
    if (name && valid) document.title = name + ' · ChiTransit';

    var openApp = document.getElementById('open-app');
    var openMaps = document.getElementById('open-maps');
    if (!valid) {
      document.getElementById('lede').textContent = 'It may have been cut short when it was copied. Ask your friend to share it again.';
      document.getElementById('actions').hidden = true;
      return;
    }

    var params = 'lat=' + lat.toFixed(5) + '&lon=' + lon.toFixed(5) + '&name=' + encodeURIComponent(name || 'Shared location');
    var scheme = 'chitransit://place?' + params;
    openMaps.href = 'https://www.google.com/maps/search/?api=1&query=' + lat.toFixed(5) + ',' + lon.toFixed(5);

    var ua = navigator.userAgent;
    var android = /Android/i.test(ua);
    var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (android) {
      // Chrome's intent link: opens the app when it is installed, and the Play Store page when it is not.
      openApp.href = 'intent://place?' + params + '#Intent;scheme=chitransit;package=' + PACKAGE +
        ';S.browser_fallback_url=' + encodeURIComponent(PLAY) + ';end';
      // Tried once on arrival, which is the redirect a friend expects. Some browsers only follow it from a
      // tap - then the buttons are the way, and Google Maps stays one tap away either way.
      if (!sessionStorage.getItem('tried')) {
        try { sessionStorage.setItem('tried', '1'); } catch (e) {}
        location.href = openApp.href;
      }
    } else if (ios) {
      openApp.href = scheme;
      // iOS answers a scheme the phone does not know with an error, not a fallback, so this is never tried
      // unasked; after a tap, a page still in front means the app is not there.
      openApp.addEventListener('click', function () {
        var trying = document.getElementById('trying');
        setTimeout(function () { if (!document.hidden) trying.hidden = false; }, 1500);
      });
    } else {
      // A computer: no app to open. Google Maps and the store links are what is useful.
      openApp.hidden = true;
      openMaps.classList.add('btn--primary');
    }
  })();
</script>
</body>
</html>
