<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChiTransit</title>
<meta name="description" content="Chicago transit: CTA trains and buses, Metra and Divvy, in one app.">
<style>
  :root { --paper: #EEF1F5; --surface: #FFFFFF; --ink: #12171E; --muted: #39424F; --rule: #D6DCE3; --on-ink: #EEF1F5; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0D1117; --surface: #1C2430; --ink: #E6EBF1; --muted: #B4BECB; --rule: #2A333F; --on-ink: #0D1117; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
         box-sizing: border-box; background: var(--paper); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 420px; width: 100%; background: var(--surface); border: 1px solid var(--rule); border-radius: 20px; padding: 28px 24px; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 24px; }
  p { margin: 0 0 20px; color: var(--muted); }
  a.btn { display: block; padding: 15px 20px; border-radius: 999px; background: var(--ink); color: var(--on-ink); font-weight: 600; text-decoration: none; }
  .small { margin: 16px 0 0; font-size: 13px; }
  .small a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>ChiTransit</h1>
  <p>CTA trains and buses, Metra and Divvy, in one app.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.committeam.chitransit">Get it on Google Play</a>
  <p class="small"><a href="https://commit-team.github.io/chitransit-privacy/">Privacy policy</a></p>
</main>
</body>
</html>
